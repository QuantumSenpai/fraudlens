<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FraudLens — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #ECE9F7;
    --bg-2: #DAD5EF;
    --navy: #1C1A33;
    --card: #FFFFFF;
    --accent: #6C5CE7;
    --text: #201E3A;
    --muted: #75738F;
    --safe: #2FAE6E;
    --danger: #E5546B;
    --border: #E4E1F2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text);
    background: radial-gradient(circle at 20% -10%, var(--bg-2), var(--bg-1) 55%);
    min-height: 100vh;
    padding: 48px 20px 80px;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 8px; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 18px; margin-bottom: 36px; }
  .brand .mark { width: 20px; height: 20px; position: relative; }
  .brand .mark::before, .brand .mark::after { content: ""; position: absolute; background: var(--accent); border-radius: 2px; }
  .brand .mark::before { width: 20px; height: 4px; top: 8px; left: 0; }
  .brand .mark::after { width: 4px; height: 20px; top: 0; left: 8px; }

  h1 { font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 14.5px; margin-bottom: 28px; }

  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 24px; }
  .stat-card {
    background: var(--card);
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 16px 40px -20px rgba(28,26,51,0.16);
  }
  .stat-card .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 8px; }
  .stat-card .value { font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 600; }
  .stat-card.flagged .value { color: var(--danger); }
  .stat-card.rate .value { color: var(--accent); }

  .list-card {
    background: var(--navy);
    border-radius: 20px;
    padding: 6px;
  }
  .list-title { font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; color: #fff; padding: 16px 18px 8px; }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr 90px 90px 70px;
    gap: 8px;
    padding: 12px 18px;
    font-size: 13px;
    color: rgba(255,255,255,0.85);
    border-top: 1px solid rgba(255,255,255,0.07);
    align-items: center;
  }
  .row.head {
    color: rgba(255,255,255,0.45);
    text-transform: uppercase;
    font-size: 10.5px;
    letter-spacing: 0.04em;
    border-top: none;
  }
  .badge { padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; display: inline-block; width: fit-content; }
  .badge.clean { background: rgba(47,174,110,0.18); color: var(--safe); }
  .badge.flagged { background: rgba(229,84,107,0.18); color: var(--danger); }

  .empty { padding: 30px 18px; color: rgba(255,255,255,0.5); font-size: 13.5px; text-align: center; }
  .refresh { margin-top: 18px; text-align: right; }
  .refresh button {
    background: none; border: none; color: var(--accent); font-family: 'Inter', sans-serif;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .orb { position: fixed; border-radius: 50%; filter: blur(70px); opacity: 0.5; pointer-events: none; z-index: 0; }
  .orb-1 { width: 320px; height: 320px; background: #B7A9F0; top: -80px; left: -100px; }
  .orb-2 { width: 260px; height: 260px; background: #8FE3D0; bottom: -60px; right: -80px; }
  .wrap { position: relative; z-index: 1; }
  .stat-card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
  .stat-card:hover { transform: translateY(-3px); box-shadow: 0 24px 50px -18px rgba(28,26,51,0.22); }
  .row { transition: background 0.15s ease; }
  .row:not(.head):hover { background: rgba(255,255,255,0.04); }
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="wrap">
  <div class="brand"><span class="mark"></span> FraudLens</div>
  <h1>Dashboard</h1>
  <div class="sub">Live view of scored transactions</div>

  <div class="stat-grid">
    <div class="stat-card">
      <div class="label">Total transactions</div>
      <div class="value" id="stat-total">—</div>
    </div>
    <div class="stat-card flagged">
      <div class="label">Flagged</div>
      <div class="value" id="stat-flagged">—</div>
    </div>
    <div class="stat-card rate">
      <div class="label">Flag rate</div>
      <div class="value" id="stat-rate">—</div>
    </div>
  </div>

  <div class="list-card">
    <div class="list-title">Recent transactions</div>
    <div class="row head">
      <span>User</span><span>Device</span><span>Amount</span><span>Score</span><span>Status</span>
    </div>
    <div id="tx-list"></div>
  </div>

  <div class="refresh"><button id="refresh-btn">Refresh</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/dashboard.js"></script>
</body>
</html>
